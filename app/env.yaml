# run_env.yaml
working_dir: .
pip:
  - google-cloud-aiplatform==1.140.0
  - google-cloud-bigquery==3.40.1
  - google-cloud-bigquery-storage
  - google-cloud-storage==3.9.0
  - pandas-gbq==0.34.0
  - pydantic==2.12.5
  - ray[default, data]
  - google-genai
  - python-dotenv==1.2.1
  - gcsfs
  - chardet
  - urllib3
  - charset_normalizer
env_vars:
  PROJECT_ID: ""
  GEMINI_LOCATION: "global"
  GEMINI_MODEL: "gemini-2.5-flash"
  BQ_LOCATION: "asia-northeast3"
  BQ_TABLE_NAME: "csv_parse_ds.blue_work4_csv_result"
  BQ_BACKUP_TABLE: "csv_parse_ds.blue_work4_csv_result_backup"
  MAX_RETRY_CNT: "8"
